<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="720" viewBox="0 0 1520 720" role="img" aria-labelledby="title desc">
  <title id="title">LabelHub 架构与模块划分</title>
  <desc id="desc">展示 Owner、Labeler、AI Agent、Reviewer 在 LabelHub 标注质检流程中的模块划分和流转关系。</desc>
  <defs>
    <style>
      .lane { fill: #eff4ff; }
      .lane-ai { fill: #efe5ff; }
      .role { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .small { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .node { fill: #ffffff; stroke: #84adff; stroke-width: 3; rx: 10; }
      .node-ai { fill: #ffffff; stroke: #8d6be8; stroke-width: 3; rx: 10; }
      .icon-blue { stroke: #377cff; fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .icon-purple { stroke: #8d6be8; fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .blue { stroke: #377cff; }
      .green { stroke: #4f965b; }
      .orange { stroke: #f05a36; }
      .arrow { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .avatar { fill: #377cff; }
      .legend-text { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .pass { fill: #4f965b; }
      .reject { fill: #f05a36; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#377cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f965b" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f05a36" />
    </marker>
  </defs>

  <rect x="35" y="36" width="1140" height="164" class="lane" rx="8" />
  <rect x="35" y="225" width="1140" height="164" class="lane" rx="8" />
  <rect x="35" y="414" width="1140" height="164" class="lane-ai" rx="8" />
  <rect x="35" y="603" width="1140" height="80" class="lane" rx="8" />

  <circle cx="115" cy="100" r="42" class="avatar" />
  <path d="M100 121c5-16 30-16 35 0M105 117c7-8 6-14 4-21-2-12 4-20 14-20s16 8 14 20c-2 7-3 13 4 21" stroke="#ffffff" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="80" y="178" class="role">Owner</text>

  <circle cx="115" cy="289" r="42" class="avatar" />
  <path d="M100 310c5-16 30-16 35 0M105 306c7-8 6-14 4-21-2-12 4-20 14-20s16 8 14 20c-2 7-3 13 4 21" stroke="#ffffff" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="72" y="367" class="role">Labeler</text>

  <circle cx="115" cy="478" r="42" class="avatar" />
  <rect x="96" y="462" width="38" height="30" rx="7" stroke="#ffffff" fill="none" stroke-width="4" />
  <circle cx="108" cy="477" r="3" fill="#ffffff" />
  <circle cx="123" cy="477" r="3" fill="#ffffff" />
  <path d="M115 449v12M88 477h8M134 477h8M104 493h22" stroke="#ffffff" fill="none" stroke-width="4" stroke-linecap="round" />
  <text x="52" y="556" class="role">AI Agent</text>

  <circle cx="115" cy="667" r="42" class="avatar" />
  <path d="M100 688c5-16 30-16 35 0M105 684c7-8 6-14 4-21-2-12 4-20 14-20s16 8 14 20c-2 7-3 13 4 21" stroke="#ffffff" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="62" y="710" class="role">Reviewer</text>

  <rect x="215" y="78" width="180" height="88" class="node" />
  <path d="M240 104h42v42h-42zM282 114h25M282 136h25M307 114a10 10 0 1 0 0 20" class="icon-blue" />
  <text x="307" y="116" class="label">配置模板</text>
  <text x="307" y="148" class="label">创建任务</text>

  <rect x="470" y="78" width="180" height="88" class="node" />
  <path d="M493 118l55-28-22 58-10-26z" class="icon-blue" />
  <text x="553" y="116" class="label">配置模板</text>
  <text x="553" y="148" class="label">创建任务</text>

  <rect x="215" y="262" width="180" height="88" class="node" />
  <path d="M243 281h42v14h-42zM249 295v37h30v-37M257 316l10 10 18-22" class="icon-blue" />
  <text x="307" y="303" class="label">任务广场</text>
  <text x="307" y="335" class="label">领取任务</text>

  <rect x="470" y="262" width="180" height="88" class="node" />
  <path d="M506 324l13 13 42-42-13-13zM506 324l-9 22 22-9" class="icon-blue" />
  <text x="553" y="318" class="label">题目标注</text>

  <rect x="725" y="262" width="180" height="88" class="node" />
  <path d="M758 284h38v51h-38zM770 299h18M770 314h18M803 319l22 22M809 338l20-20" class="icon-blue" />
  <text x="806" y="318" class="label">提交结果</text>

  <rect x="725" y="452" width="180" height="88" class="node-ai" />
  <rect x="749" y="475" width="43" height="34" rx="7" class="icon-purple" />
  <circle cx="762" cy="492" r="3" fill="#8d6be8" />
  <circle cx="779" cy="492" r="3" fill="#8d6be8" />
  <path d="M770 461v14M740 492h9M792 492h9M759 511h23M812 505v28M798 519h28" class="icon-purple" />
  <text x="806" y="507" class="label">AI 预审</text>

  <rect x="725" y="608" width="180" height="88" class="node" />
  <path d="M758 628h41v48h-41zM769 640h17M769 654h17M808 664a14 14 0 1 0 0.1 0M818 674l16 16" class="icon-blue" />
  <text x="806" y="663" class="label">人工复审</text>

  <rect x="985" y="76" width="180" height="88" class="node" />
  <path d="M1024 99h38M1024 99v50h38M1060 124h53M1092 103l22 21-22 21" class="icon-blue" />
  <text x="1070" y="130" class="label">数据导出</text>

  <path d="M400 122h55" class="arrow blue" marker-end="url(#arrow-blue)" />
  <path d="M560 169v78" class="arrow blue" marker-end="url(#arrow-blue)" />
  <path d="M400 306h55" class="arrow blue" marker-end="url(#arrow-blue)" />
  <path d="M655 306h55" class="arrow blue" marker-end="url(#arrow-blue)" />
  <path d="M815 354v83" class="arrow blue" marker-end="url(#arrow-blue)" />
  <path d="M815 546v47" class="arrow green" marker-end="url(#arrow-green)" />
  <path d="M910 652h132v-475" class="arrow green" marker-end="url(#arrow-green)" />

  <path d="M709 495h-149v-129" class="arrow orange" marker-end="url(#arrow-orange)" />
  <text x="622" y="502" class="small reject">不通过</text>
  <path d="M709 652h-149v-286" class="arrow orange" marker-end="url(#arrow-orange)" />
  <text x="622" y="660" class="small reject">不通过</text>
  <text x="790" y="592" class="small pass">通过</text>
  <text x="980" y="662" class="small pass">通过</text>

  <path d="M1210 300h68" class="arrow blue" marker-end="url(#arrow-blue)" />
  <text x="1310" y="310" class="legend-text">蓝色：正常流转</text>
  <path d="M1210 400h68" class="arrow green" marker-end="url(#arrow-green)" />
  <text x="1310" y="410" class="legend-text">绿色：审核通过</text>
  <path d="M1210 500h68" class="arrow orange" marker-end="url(#arrow-orange)" />
  <text x="1310" y="510" class="legend-text">橙色：打回返修</text>
</svg>
