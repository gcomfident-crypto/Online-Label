components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
  schemas:
    Envelope:
      type: "object"
      required:
        - "data"
        - "requestId"
      properties:
        data:
          description: "业务响应数据。"
          oneOf:
            -
              type: "object"
              additionalProperties: true
            -
              type: "array"
              items:
                type: "object"
                additionalProperties: true
            -
              type: "null"
        requestId:
          type: "string"
          example: "req_abc123"
    ErrorEnvelope:
      type: "object"
      required:
        - "error"
        - "requestId"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
            message:
              type: "string"
        requestId:
          type: "string"
          example: "req_abc123"
    GenericObject:
      type: "object"
      additionalProperties: true
